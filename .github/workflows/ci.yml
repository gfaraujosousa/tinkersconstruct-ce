name: CI

on:
  push:
    branches:
      - main
      - develop
      - port/**
      - feat/**
      - fix/**
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check wrapper files
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Print Gradle version
        run: ./gradlew --version

  build:
    name: Build And Datagen
    runs-on: ubuntu-latest
    needs: validate-wrapper
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Print Gradle version
        run: ./gradlew --version

      - name: Build
        run: ./gradlew clean build --no-build-cache

      - name: Run datagen
        run: ./gradlew runData --no-build-cache

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: tconstruct-ce-jars
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload generated data
        uses: actions/upload-artifact@v4
        with:
          name: tconstruct-ce-generated-data
          path: src/generated/resources/**
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tconstruct-ce-test-reports
          path: |
            build/reports/**
            build/test-results/**
            run/**/logs/**
          if-no-files-found: ignore

  game-tests:
    name: Game Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run GameTest server
        run: ./gradlew runGameTestServer --no-build-cache

      - name: Upload game test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tconstruct-ce-game-test-logs
          path: run/**/logs/**
          if-no-files-found: ignore

  server-smoke:
    name: Dedicated Server Smoke
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run dedicated server startup smoke test
        shell: bash
        run: |
          set +e
          timeout 180s ./gradlew runServer --no-build-cache
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            if grep -R "Done (" run/server/logs/latest.log run/logs/latest.log 2>/dev/null; then
              echo "Server reached startup before timeout."
              exit 0
            fi
            echo "Server timed out before startup."
            exit 1
          fi
          exit "$code"

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tconstruct-ce-server-smoke-logs
          path: run/**/logs/**
          if-no-files-found: ignore
