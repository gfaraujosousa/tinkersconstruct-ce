name: Nightly

on:
  schedule:
    - cron: '25 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    name: Build Nightly Artifact
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build nightly
        run: ./gradlew clean build runData

      - name: Upload nightly jars
        uses: actions/upload-artifact@v4
        with:
          name: tconstruct-ce-nightly-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload nightly logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tconstruct-ce-nightly-logs-${{ github.sha }}
          path: |
            build/reports/**
            build/test-results/**
            run/**/logs/**
          if-no-files-found: ignore
